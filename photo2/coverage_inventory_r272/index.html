<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bead coverage inventory</title><link rel="stylesheet" href="style.css"></head>
<body><header><form id="jumpForm"><label for="jump">Bead ID</label><input id="jump" placeholder="C-2284-1877" autocomplete="off"><button>Go</button></form><div class="group"><button id="smallest">Smallest</button><button id="largest">Largest</button></div><div class="group"><label for="nth">N</label><input id="nth" type="number" min="1" value="1"><button id="nthSmallest">Nth smallest</button><button id="nthLargest">Nth largest</button></div><div class="group"><button id="previous">Previous</button><button id="next">Next</button></div><div class="group"><button id="zoomOut" aria-label="Zoom out">−</button><button id="zoomIn" aria-label="Zoom in">+</button><button id="fit">Fit photo</button></div><label class="group"><input type="checkbox" id="overlays" checked> Overlays</label><label class="group"><input type="checkbox" id="uncertain"> Excluded candidates</label></header>
<main><div id="stage"><canvas id="photo" tabindex="0" aria-label="Photograph with selectable bead regions. Drag to pan; scroll to zoom."></canvas><div id="message" role="status" aria-live="polite">Loading photograph…</div></div><aside><h1>Bead inventory</h1><p id="ordering"></p><div id="details">Click a cyan region or enter its ID.</div><p class="hint">Drag to pan. Scroll to zoom.<br>Pixel counts use the exact mask.</p></aside></main>
<script src="../review/r272-coverage/inventory.js"></script><script src="app.js"></script></body></html>
