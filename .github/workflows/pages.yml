name: Validate and publish curated Beads

on:
  push:
    branches: [master, curate-research-pages]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check reusable geometry, evidence and publication boundary
        run: python3 -m unittest discover -s tests -v
      - name: Check presentation JavaScript
        run: node --check site/app.js
      - name: Build and verify the explicit allowlist
        run: |
          python3 scripts/build_site.py
          python3 scripts/build_site.py --check
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/beads
  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy selected static files
        id: deployment
        uses: actions/deploy-pages@v5
